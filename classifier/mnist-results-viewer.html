<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MNIST Loss Chart</title>
<style>
:root{color-scheme:dark;--bg:#10131a;--card:#191f2b;--line:#77b8ff;--muted:#a9b5c8;--edge:#334158}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#1c2a44,#10131a 55%);color:#f2f6fc;font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1120px;margin:auto;padding:42px 20px}h1{font-size:30px;margin:0 0 6px}p,.status{color:var(--muted)}.picker{display:block;margin:25px 0;border:2px dashed #506786;border-radius:14px;padding:26px;text-align:center;background:#141b28;cursor:pointer}.picker:hover,.picker.drag{border-color:var(--line);background:#192641}.picker input{display:none}.chart-card{position:relative;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:18px;min-height:520px}.topline{display:flex;gap:22px;align-items:baseline;flex-wrap:wrap;margin-bottom:12px}.metric{font-size:13px;color:var(--muted)}.metric b{color:#fff;font-size:20px;margin-left:5px}.control{margin-left:auto;color:var(--muted);font-size:14px}.control select{margin-left:6px;color:#f2f6fc;background:#263650;border:1px solid #58739b;border-radius:6px;padding:6px}.canvas-wrap{position:relative;height:420px;touch-action:none}canvas{display:block;width:100%;height:100%;cursor:crosshair}.tip{position:absolute;display:none;pointer-events:none;transform:translate(12px,-110%);background:#090d14;border:1px solid #5d7398;border-radius:7px;padding:7px 9px;box-shadow:0 5px 18px #0008;font-size:13px;white-space:nowrap}.hint{font-size:13px;color:var(--muted);margin:9px 0 0}@media(max-width:600px){.wrap{padding:25px 13px}.chart-card{padding:12px}.canvas-wrap{height:350px}.control{margin-left:0}}
</style></head><body><main class="wrap"><h1>Loss over time</h1><p>Choose your <code>training_results.json</code>. It is processed locally in your browser.</p>
<label class="picker" id="drop"><input id="file" type="file" accept="application/json,.json"><strong>Choose a results JSON file</strong><br><span>or drag it here</span></label><div class="status" id="status">Waiting for a file.</div>
<section class="chart-card" id="chartCard" hidden><div class="topline"><div class="metric">Numeric losses <b id="count">—</b></div><div class="metric">Average <b id="mean">—</b></div><div class="metric">Min / max <b id="range">—</b></div><label class="control">Smoothing <select id="window"><option value="1">Raw loss</option><option value="100">100 samples</option><option value="500" selected>500 samples</option></select></label></div><div class="canvas-wrap" id="canvasWrap"><canvas id="chart"></canvas><div class="tip" id="tip"></div></div><div class="hint" id="hint">Hover over the line to inspect a batch-average loss.</div></section></main>
<script>
const $=id=>document.getElementById(id);let worker,losses=[],series=[],plot=[],bounds,hover=-1;
const fmt=n=>Number.isFinite(n)?(Math.abs(n)>=1e4||(Math.abs(n)<1e-4&&n!==0)?n.toExponential(4):n.toFixed(6).replace(/0+$/,'').replace(/\.$/,'')):'null';
const workerCode=`let values=[];const keys=['loss','mse','error','cost'];function getArray(root){if(Array.isArray(root))return root;if(root&&typeof root==='object'){for(const k of ['results','training_results','records','data','examples','samples'])if(Array.isArray(root[k]))return root[k];for(const v of Object.values(root))if(Array.isArray(v)&&v.length&&typeof v[0]==='object')return v}return null}function loss(r){if(typeof r==='number')return r;if(r&&typeof r==='object'){for(const k of keys)if(typeof r[k]==='number'&&Number.isFinite(r[k]))return r[k]}return null}onmessage=e=>{try{const root=JSON.parse(new TextDecoder().decode(e.data));const records=getArray(root);if(!records)throw Error('Could not find a results array. Expected a top-level array or results, records, data, or training_results.');values=records.map(loss);let good=values.filter(Number.isFinite),sum=good.reduce((a,b)=>a+b,0);postMessage({values,count:records.length,valid:good.length,mean:good.length?sum/good.length:null,min:good.length?Math.min(...good):null,max:good.length?Math.max(...good):null})}catch(err){postMessage({error:err.message||String(err)})}}`;
function start(){if(worker)worker.terminate();worker=new Worker(URL.createObjectURL(new Blob([workerCode],{type:'text/javascript'})));worker.onmessage=e=>{let d=e.data;if(d.error){$('status').textContent='Error: '+d.error;return}losses=d.values;$('count').textContent=d.valid.toLocaleString()+' / '+d.count.toLocaleString();$('mean').textContent=fmt(d.mean);$('range').textContent=fmt(d.min)+' / '+fmt(d.max);$('status').textContent='Loaded '+d.count.toLocaleString()+' results.';$('chartCard').hidden=false;$('hint').textContent=d.valid?'Hover over the chart to inspect the exact loss at a result index.':'No numeric loss values found.';render()}}
function load(file){if(!file)return;$('status').textContent='Reading '+file.name+'…';$('chartCard').hidden=true;start();let r=new FileReader();r.onload=()=>worker.postMessage(r.result,[r.result]);r.onerror=()=>$('status').textContent='Could not read that file.';r.readAsArrayBuffer(file)}
function makeSeries(){let window=+$('window').value,out=[];for(let start=0;start<losses.length;start+=window){let end=Math.min(losses.length,start+window),sum=0,n=0;for(let i=start;i<end;i++)if(Number.isFinite(losses[i])){sum+=losses[i];n++}out.push({start,end:end-1,value:n?sum/n:null,n})}return out}
function makePlot(max=12000){let n=series.length;if(n<=max)return series;let out=[],bucket=Math.ceil(n/(max/2));for(let s=0;s<n;s+=bucket){let e=Math.min(n,s+bucket),min=null,maxv=null;for(let i=s;i<e;i++){let p=series[i];if(Number.isFinite(p.value)){if(!min||p.value<min.value)min=p;if(!maxv||p.value>maxv.value)maxv=p}}if(min&&maxv){if(min.start<maxv.start)out.push(min,maxv);else out.push(maxv,min)}}return out.sort((a,b)=>a.start-b.start)}
function render(){if(!losses.length)return;series=makeSeries();let c=$('chart'),box=$('canvasWrap').getBoundingClientRect(),d=devicePixelRatio,w=box.width,h=box.height;c.width=Math.floor(w*d);c.height=Math.floor(h*d);let g=c.getContext('2d');g.setTransform(d,0,0,d,0,0);g.clearRect(0,0,w,h);plot=makePlot();let good=plot.filter(p=>Number.isFinite(p.value));if(!good.length)return;let lo=Math.min(...good.map(p=>p.value)),hi=Math.max(...good.map(p=>p.value));if(lo===hi){lo-=1;hi+=1}bounds={w,h,l:55,r:15,t:16,b:32,lo,hi};let b=bounds,pw=w-b.l-b.r,ph=h-b.t-b.b;g.font='12px system-ui';g.strokeStyle='#3b4b63';g.fillStyle='#a9b5c8';g.lineWidth=1;for(let j=0;j<5;j++){let y=b.t+ph*j/4;g.beginPath();g.moveTo(b.l,y);g.lineTo(b.l+pw,y);g.stroke();g.fillText(fmt(hi-(hi-lo)*j/4),2,y+4)}g.fillText('result 0',b.l,h-8);g.fillText('result '+(losses.length-1),Math.max(b.l,w-112),h-8);g.strokeStyle='#77b8ff';g.lineWidth=1.35;g.beginPath();let open=false;for(const p of plot){if(!Number.isFinite(p.value)){open=false;continue}let x=b.l+pw*p.start/Math.max(1,losses.length-1),y=b.t+ph*(1-(p.value-lo)/(hi-lo));if(!open){g.moveTo(x,y);open=true}else g.lineTo(x,y)}g.stroke();if(hover>=0){let p=series[hover];if(Number.isFinite(p.value)){let x=b.l+pw*p.start/Math.max(1,losses.length-1),y=b.t+ph*(1-(p.value-lo)/(hi-lo));g.strokeStyle='#d6e8ff';g.beginPath();g.moveTo(x,b.t);g.lineTo(x,b.t+ph);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(x,y,4,0,Math.PI*2);g.fill()}}}
function move(e){if(!bounds||!series.length)return;let rect=$('chart').getBoundingClientRect(),b=bounds,x=Math.max(b.l,Math.min(b.w-b.r,e.clientX-rect.left)),result=Math.round((x-b.l)/(b.w-b.l-b.r)*(losses.length-1)),window=+$('window').value;hover=Math.min(series.length-1,Math.floor(result/window));render();let tip=$('tip'),p=series[hover];tip.style.display='block';tip.style.left=x+'px';tip.style.top=Math.max(b.t,Math.min(b.h-b.b,e.clientY-rect.top))+'px';tip.textContent='Results '+p.start+'–'+p.end+'  •  Average loss: '+fmt(p.value)}
const drop=$('drop');$('file').onchange=e=>load(e.target.files[0]);['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('drag')}));['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('drag')}));drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));$('chart').addEventListener('pointermove',move);$('chart').addEventListener('pointerleave',()=>{$('tip').style.display='none';hover=-1;render()});$('window').onchange=()=>{hover=-1;$('tip').style.display='none';render()};addEventListener('resize',render);
</script></body></html>
